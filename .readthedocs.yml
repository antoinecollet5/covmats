# .readthedocs.yml
version: 2

# Sphinx configuration
sphinx:
  configuration: docs/sources/conf.py

# Build environment
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - libsuitesparse-dev
  # Run shell commands before building the docs
  commands:
    # Install uv and marimo in the system Python first
    - pip install --upgrade pip
    - pip install -e ".[scikit_sparse_old,all]"
    # Export Marimo notebooks into docs/notebooks
    - marimo export ipynb notebooks/examples_covariances.py -o notebooks/examples_covariances.ipynb --sort=top-down
    - marimo export ipynb notebooks/examples_priors.py -o notebooks/examples_priors.ipynb --sort=top-down

# Optional: keep python.install to satisfy RTD schema (can install nothing extra)
python:
  install:
    - method: pip
      path: "."
