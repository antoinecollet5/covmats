# .readthedocs.yml
version: 2

sphinx:
  configuration: docs/sources/conf.py

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - libsuitesparse-dev
  commands:
    # -------------------------------------------
    # 1) Upgrade pip and install conda
    # -------------------------------------------
    - pip install --upgrade pip setuptools wheel conda
    - conda install -y -c conda-forge scikit-sparse suite-sparse

    # -------------------------------------------
    # 3) Create a uv virtual environment (optional)
    # -------------------------------------------
    - pip install -e ".[all]"

    # -------------------------------------------
    # 4) Export notebooks before Sphinx build
    # -------------------------------------------
    - marimo export ipynb notebooks/examples_covariances.py -o notebooks/examples_covariances.ipynb --sort=top-down
    - marimo export ipynb notebooks/examples_priors.py -o notebooks/examples_priors.ipynb --sort=top-down

python:
  install:
    # A placeholder install (RTD requires at least one install entry)
    - method: pip
      path: "."
